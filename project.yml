name: ioant-Clip
options:
  bundleIdPrefix: com.ioant
  deploymentTarget:
    macOS: '14.0'
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    INFOPLIST_KEY_CFBundleDisplayName: ioant-Clip
    CODE_SIGN_STYLE: Automatic
targets:
  ioant-Clip-macOS:
    type: application
    platform: macOS
    sources: [App, Sources/ClipCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ioant.clip.macos
        ENABLE_HARDENED_RUNTIME: YES
  ioant-Clip-iOS:
    type: application
    platform: iOS
    sources: [App, Sources/ClipCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ioant.clip.ios
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
